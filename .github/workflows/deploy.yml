name: Deploy API

# Push to master -> CI runs -> if CI passes, the API is deployed to the VPS automatically.
# Manual runs (Actions tab -> Run workflow) can redeploy any branch, tag or commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag or commit SHA)
        default: master

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Only deploy when API-side files changed in the pushed commit (web is deployed separately).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.ref }}
          fetch-depth: 2
      - name: Did the API change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "api=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(app/api/|deploy/|docker-compose\.production\.yml|\.github/workflows/deploy\.yml)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"; echo "No API changes in this push; skipping deploy."
          fi

      - name: Deploy over SSH (check env, back up, build, start, health check, roll back on failure)
        if: steps.changed.outputs.api == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.event.inputs.ref }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_REF
          script_stop: true
          script: |
            set -euo pipefail
            cd "${REPSI_DIR:-/opt/repsi-core}"
            git fetch --prune origin
            # Run the deploy script from the commit being deployed. The checkout happens inside it,
            # after it has recorded the current release, so a failed health check can roll back.
            git show "$DEPLOY_REF:deploy/deploy.sh" > /tmp/repsi-deploy.sh
            bash /tmp/repsi-deploy.sh "$DEPLOY_REF"
