name: Release Repsi

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.0.2)'
        required: true
        default: 'v0.0.2'

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event.inputs.tag_name || github.ref_name }}
  REPSI_DESKTOP_URL: https://repsi.app

jobs:
  mobile-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set Flutter version in pubspec.yaml
        working-directory: app/mobile
        run: |
          VERSION_NUM="${RELEASE_VERSION#v}"
          sed -i "s/^version:.*/version: ${VERSION_NUM}+${GITHUB_RUN_NUMBER}/" pubspec.yaml

      - name: Install dependencies
        working-directory: app/mobile
        run: flutter pub get

      - name: Analyze & Test
        working-directory: app/mobile
        run: |
          flutter analyze
          flutter test

      - name: Restore or generate release keystore
        working-directory: app/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using secret-provided release keystore."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret not found; creating CI release signing keystore."
            keytool -genkey -v -keystore "$RUNNER_TEMP/release.jks" -alias repsi_release -keyalg RSA -keysize 2048 -validity 10000 -storepass repsi_release_pass -keypass repsi_release_pass -dname "CN=Repsi, OU=Mobile, O=Repsi, L=Coimbatore, S=TamilNadu, C=IN"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=repsi_release_pass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=repsi_release" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=repsi_release_pass" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        working-directory: app/mobile
        run: flutter build apk --release

      - name: Prepare APK for Release
        run: |
          mkdir -p release-assets
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          cp app/mobile/build/app/outputs/flutter-apk/app-release.apk "release-assets/Repsi-${TAG}-android.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repsi-android-apk
          path: release-assets/Repsi-*-android.apk

  desktop-release:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install Desktop Node dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Build Desktop Bundle
        working-directory: app/desktop
        run: npm run build

      - name: Collect Desktop Artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"

          # Copy installers (.deb, .AppImage, .exe, .msi, .dmg, .zip)
          find app/desktop/src-tauri/target/release -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \; || true

          # If on macOS, package any .app directories into tar.gz
          if [ "${{ matrix.platform }}" = "macos" ]; then
            for appdir in $(find app/desktop/src-tauri/target/release -name "*.app" -type d); do
              appname=$(basename "$appdir" .app)
              tar -czvf "release-assets/${appname}-${TAG}-macos.app.tar.gz" -C "$(dirname "$appdir")" "${appname}.app"
            done
          fi

          # Ensure Windows has an .exe available
          if [ "${{ matrix.platform }}" = "windows" ]; then
            if ! ls release-assets/*.exe 1> /dev/null 2>&1; then
              if [ -f "app/desktop/src-tauri/target/release/app.exe" ]; then
                cp "app/desktop/src-tauri/target/release/app.exe" "release-assets/Repsi-${TAG}-windows.exe"
              fi
            fi
          fi

          echo "Collected artifacts for ${{ matrix.platform }}:"
          ls -la release-assets/

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repsi-desktop-${{ matrix.platform }}
          path: release-assets/*

  create-release:
    name: Create GitHub Release
    needs: [mobile-release, desktop-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets

      - name: Organize Release Files
        run: |
          mkdir -p final-release
          find all-assets -type f -exec cp {} final-release/ \;
          echo "Release binaries prepared for GitHub Release:"
          ls -la final-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Repsi ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: final-release/*