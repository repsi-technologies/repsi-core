name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'app/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            api:
              - 'app/api/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'app/mobile/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'app/desktop/**'
              - 'app/web/**'
              - '.github/workflows/ci.yml'

  web:
    name: Web
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - run: npm ci
      - name: Lint (errors fail the build)
        run: npx eslint . --quiet
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit (report only)
        run: npm audit --omit=dev --audit-level=high || true

  e2e:
    name: Web end-to-end (Playwright)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.5"
      - name: Install API
        working-directory: app/api
        run: uv sync --locked
      - name: Install web and Chromium
        working-directory: app/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright (scratch SQLite API + next dev; no secrets)
        working-directory: app/web
        env:
          E2E_PYTHON: ${{ github.workspace }}/app/api/.venv/bin/python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/web/playwright-report
            app/web/test-results
          retention-days: 7

  api:
    name: API
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Dependency audit (report only)
        run: uvx pip-audit --progress-spinner off || true

  mobile:
    name: Mobile
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app/mobile

      - run: flutter analyze
        working-directory: app/mobile

      - run: flutter test
        working-directory: app/mobile

      - run: flutter build apk --debug
        working-directory: app/mobile

  desktop:
    name: Desktop
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - run: npm ci
        working-directory: app/desktop

      - run: npm run desktop:prepare
        working-directory: app/desktop