name: mobile
description: "Repsi - Modern Gym Management SaaS Mobile Application"
publish_to: 'none'

version: 0.0.4+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation & Deep Linking
  go_router: ^14.8.1

  # Networking & HTTP Client
  dio: ^5.8.0+1

  # Secure Storage & Persistence
  flutter_secure_storage: 11.2.0
  shared_preferences: ^2.3.5
  google_sign_in: ^6.2.1

  # Design, Typography & Icons
  google_fonts: 6.3.3
  lucide_icons_flutter: 4.0.1
  cupertino_icons: 2.0.0

  # Charts & Visualizations
  fl_chart: 1.3.0

  # UI Components & Utils
  intl: ^0.20.2
  shimmer: 4.0.0
  cached_network_image: 4.0.5
  flutter_dotenv: 6.0.1
  lottie: 3.7.0
  health: 13.3.2
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logos/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/images/goals/
    - assets/animations/
    - assets/.env
