# gen-l10n: ARB catalogues in lib/l10n (English is the template and fallback).
# Run `flutter gen-l10n` (or any `flutter pub get` / build) after editing an ARB file.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
preferred-supported-locales: [en, ta, ml, hi]
