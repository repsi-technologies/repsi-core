<svg width="600" height="844" viewBox="0 0 600 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="50%" stop-color="#0F1116"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>

    <!-- Metallic Gold Chip Gradient -->
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588"/>
      <stop offset="35%" stop-color="#D9A74A"/>
      <stop offset="70%" stop-color="#F3DC7C"/>
      <stop offset="100%" stop-color="#996D19"/>
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9371"/>
      <stop offset="100%" stop-color="#E25822"/>
    </linearGradient>

    <!-- Carbon Pattern -->
    <pattern id="carbonGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#13151B"/>
      <rect x="8" width="8" height="8" fill="#0E1015"/>
      <rect y="8" width="8" height="8" fill="#0E1015"/>
      <rect x="8" y="8" width="8" height="8" fill="#13151B"/>
      <circle cx="4" cy="4" r="0.75" fill="#252A36" opacity="0.4"/>
      <circle cx="12" cy="12" r="0.75" fill="#252A36" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="844" rx="36" fill="url(#bgGrad)"/>
  <rect width="600" height="844" rx="36" fill="url(#carbonGrid)" opacity="0.6"/>

