<svg width="600" height="844" viewBox="0 0 600 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="50%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Orange Gradient -->
