      <stop offset="0%" stop-color="#FF9371"/>
      <stop offset="100%" stop-color="#C76706"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridBack" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1F2430" stroke-width="0.75" opacity="0.35"/>
    </pattern>

    <!-- Glowing Radial for Tick -->
    <radialGradient id="tickGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C76706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C76706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Background -->
