    <!-- E -->
    <path d="M 115 0 L 191 0 L 191 18 L 142 18 L 142 33 L 185 33 L 185 51 L 142 51 L 142 66 L 193 66 L 193 85 L 115 85 Z" fill="#FFFFFF"/>
    
    <!-- P -->
